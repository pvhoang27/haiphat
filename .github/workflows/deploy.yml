name: Test and deploy WordPress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hai-phat-vina-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test theme, business plugin and handover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP, JavaScript and shell syntax
        run: |
          set -euo pipefail
          find hai-phat-vina hai-phat-vina-core dev/deploy dev/runtime-checks -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check hai-phat-vina/assets/js/main.js
          node --check hai-phat-vina-core/assets/blocks.js
          node --check hai-phat-vina-core/assets/contact.js
          node --check hai-phat-vina-core/assets/tracking.js
          node --check hai-phat-vina-core/assets/report.js
          bash -n dev/deploy/remote.sh
          bash -n dev/sync-design.sh
          python3 -m unittest discover -s dev/tests -p 'test_*.py'
          test -f hai-phat-vina/templates/index.html
          test -f hai-phat-vina-core/hai-phat-vina-core.php
      - name: Start disposable WordPress
        run: |
          set -euo pipefail
          docker compose -f dev/compose.yaml up -d
          for attempt in $(seq 1 60); do
            if docker compose -f dev/compose.yaml exec -T wordpress php -r 'exit(is_file("/var/www/html/wp-config.php") ? 0 : 1);' && curl --silent --output /dev/null http://127.0.0.1:8787/; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install local fixtures and migrate pages
        run: |
          set -euo pipefail
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/bootstrap.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/block-setup.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/block-install.php
      - name: Check public pages, forms, private data and customer editing permissions
        run: |
          set -euo pipefail
          python3 dev/check-http.py
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-handover.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-site-identity.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-editable-blocks.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-design-export.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-design-sync.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-design-sync-config.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-customer-structure.php
          docker compose -f dev/compose.yaml exec -T wordpress php /opt/hpv-checks/verify-analytics.php
      - name: Verify legacy upgrade, repeat deployment and automatic rollback
        run: bash dev/verify-deployment.sh
      - name: Stop disposable test services
        if: always()
        run: docker compose -f dev/compose.yaml down --volumes

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Check production version and deploy changed code
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      THEME_PATH: ${{ secrets.THEME_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          THEME_PATH="${THEME_PATH%/}"
          [[ "$THEME_PATH" =~ ^/[a-zA-Z0-9_./-]+/wp-content/themes/hai-phat-vina$ ]]
          [[ "$THEME_PATH" != *..* ]]
          printf 'WP_ROOT=%s\n' "${THEME_PATH%/wp-content/themes/hai-phat-vina}" >> "$GITHUB_ENV"
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/haiphat_deploy
          chmod 600 ~/.ssh/haiphat_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Compare with the last healthy production release
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed=true
          else
            deployed="$(ssh -i ~/.ssh/haiphat_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "php -- '$WP_ROOT'" < dev/deploy/read-deployed-revision.php)"
            [[ -z "$deployed" || "$deployed" =~ ^[a-f0-9]{40}$ ]]
            changed="$(python3 dev/changed-deploy.py "$deployed" "$GITHUB_SHA")"
          fi
          printf 'deploy=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = false ]; then
            printf '%s\n' 'Production code is unchanged; skipping upload, maintenance and deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Require the dispatch credential before changing production
        if: steps.changes.outputs.deploy == 'true'
        env:
          DESIGN_SYNC_DISPATCH_TOKEN: ${{ secrets.DESIGN_SYNC_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DESIGN_SYNC_DISPATCH_TOKEN" ]; then
            printf '%s\n' 'Set production secret DESIGN_SYNC_DISPATCH_TOKEN before deploying the event-driven sync release.' >&2
            exit 1
          fi
      - name: Verify server and prepare release staging
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/haiphat_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$WP_ROOT/wp-load.php' && test -f '$WP_ROOT/wp-content/themes/hai-phat-vina/style.css' && command -v php && command -v flock && command -v crontab && mkdir -p '$WP_ROOT/wp-content/.hpv-releases/$GITHUB_SHA/theme' '$WP_ROOT/wp-content/.hpv-releases/$GITHUB_SHA/plugin'"
      - name: Upload theme, plugin and deployment lifecycle
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          transport="ssh -i $HOME/.ssh/haiphat_deploy -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes"
          destination="$DEPLOY_USER@$DEPLOY_HOST:$WP_ROOT/wp-content/.hpv-releases/$GITHUB_SHA"
          rsync --archive --compress --delay-updates --exclude='.DS_Store' -e "$transport" hai-phat-vina/ "$destination/theme/"
          rsync --archive --compress --delay-updates --exclude='.DS_Store' -e "$transport" hai-phat-vina-core/ "$destination/plugin/"
          rsync --archive --compress -e "$transport" dev/deploy/ "$destination/"
      - name: Prepare private sync configuration and check hosting prerequisites
        if: steps.changes.outputs.deploy == 'true'
        env:
          DESIGN_SYNC_DISPATCH_TOKEN: ${{ secrets.DESIGN_SYNC_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/design-sync-config.json" <<'PY'
          import json, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "token": os.environ["DESIGN_SYNC_DISPATCH_TOKEN"],
              "repository": os.environ["GITHUB_REPOSITORY"],
          }))
          PY
          ssh -i ~/.ssh/haiphat_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "php '$WP_ROOT/wp-content/.hpv-releases/$GITHUB_SHA/configure-design-sync.php' '$WP_ROOT' --check-host" < "$RUNNER_TEMP/design-sync-config.json"
      - name: Back up, activate, migrate and verify production
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/haiphat_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$WP_ROOT/wp-content/.hpv-releases/$GITHUB_SHA/remote.sh' '$WP_ROOT' '$GITHUB_SHA'"
      - name: Configure private WordPress dispatch and hosting queue worker
        if: steps.changes.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/haiphat_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "php '$WP_ROOT/wp-content/.hpv-releases/$GITHUB_SHA/configure-design-sync.php' '$WP_ROOT'" < "$RUNNER_TEMP/design-sync-config.json"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/haiphat_deploy "$RUNNER_TEMP/design-sync-config.json"
