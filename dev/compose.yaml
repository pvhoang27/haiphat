name: haiphat-theme-check
services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local_theme_check
      MARIADB_ROOT_PASSWORD: local_database_check
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:80"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local_theme_check
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress:/var/www/html
      - ../hai-phat-vina:/var/www/html/wp-content/themes/hai-phat-vina:ro
      - ./runtime-checks:/opt/hpv-checks:ro
volumes:
  database:
  wordpress:
